name: alignn
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: alignn
      POSTGRES_USER: alignn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alignn -d alignn"]
      interval: 5s
      timeout: 3s
      retries: 10
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  objects:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${OBJECT_ACCESS_KEY:?Set a local object key}
      MINIO_ROOT_PASSWORD: ${OBJECT_SECRET_KEY:?Set a local object secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objects:/data"]
  scanner:
    image: clamav/clamav:stable
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["signatures:/var/lib/clamav"]
volumes:
  postgres:
  objects:
  signatures:

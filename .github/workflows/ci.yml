name: Alignn checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alignn
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: alignn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alignn -d alignn_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://alignn:integration-only@localhost:5432/alignn_test
      TEST_DATABASE_URL: postgresql+psycopg://alignn:integration-only@localhost:5432/alignn_test
      ENVIRONMENT: test
      PUBLIC_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project apps/api --locked
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api pytest apps/api/tests -q

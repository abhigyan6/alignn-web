name: Deploy Alignn
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alignn-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      AWS_PAGER: ""
      DEPLOY_ROLE: ${{ vars.ALIGNN_DEPLOY_ROLE_ARN }}
      TARGET_INSTANCE: ${{ vars.ALIGNN_DEPLOY_INSTANCE_ID }}
      DEPLOY_DOCUMENT: ${{ vars.ALIGNN_DEPLOY_DOCUMENT }}
      CLERK_PUBLIC_KEY: ${{ vars.ALIGNN_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release variables
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ROLE" =~ ^arn:aws:iam::([0-9]{12}):role/.+$ ]]
          echo "REGISTRY=${BASH_REMATCH[1]}.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_ENV"
          [[ "$TARGET_INSTANCE" =~ ^i-[0-9a-f]{17}$ ]]
          [[ "$DEPLOY_DOCUMENT" =~ ^[a-zA-Z0-9_.-]{3,128}$ ]]
          [[ "$CLERK_PUBLIC_KEY" =~ ^pk_live_[A-Za-z0-9_=-]+$ ]]
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.ALIGNN_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: alignn-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Build and publish ARM images
        id: images
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx build --platform linux/arm64 --push \
            --metadata-file "$RUNNER_TEMP/api-image.json" \
            --tag "$REGISTRY/alignn-api:$tag" apps/api
          docker buildx build --platform linux/arm64 --push \
            --metadata-file "$RUNNER_TEMP/web-image.json" \
            --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLIC_KEY" \
            --tag "$REGISTRY/alignn-web:$tag" -f apps/web/Dockerfile .
          for image in api web; do
            digest="$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/$image-image.json")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "$image=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Release on EC2 and verify HTTPS
        shell: bash
        env:
          API_DIGEST: ${{ steps.images.outputs.api }}
          WEB_DIGEST: ${{ steps.images.outputs.web }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg api "$API_DIGEST" --arg web "$WEB_DIGEST" --arg sha "$GITHUB_SHA" \
            '{ApiDigest:[$api],WebDigest:[$web],Revision:[$sha]}')"
          command_id="$(aws ssm send-command --document-name "$DEPLOY_DOCUMENT" \
            --instance-ids "$TARGET_INSTANCE" --parameters "$payload" \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"
          for attempt in $(seq 1 100); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$TARGET_INSTANCE" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                curl -fsS --max-time 15 https://alignn.onlyward.app/api/ready > /dev/null
                curl -fsS --max-time 15 https://alignn.onlyward.app/explore > /dev/null
                printf 'Deployed `%s` to Alignn.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "::error::Release command $command_id returned $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Release result unavailable. Check SSM command $command_id before retrying."
          exit 1

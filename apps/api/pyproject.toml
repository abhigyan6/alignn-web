[project]
name = "alignn-api"
version = "0.1.0"
description = "Alignn opportunity discovery API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "python-multipart>=0.0.20",
  "clerk-backend-api>=7.1,<8",
  "httpx>=0.28,<1",
  "boto3>=1.36,<2",
  "python-magic>=0.4.27",
  "scrapy>=2.13,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9",
    "pytest-cov>=6",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alignn", "src/alignn_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["alignn", "alignn_scraper"]

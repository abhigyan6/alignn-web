[project]
name = "alignn-scraper"
version = "1.0.0"
description = "Bounded India-first public career opportunity collector"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "pydantic==2.14.2"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
